<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>work on lore</title><meta name="description" content="apply to work on growth at lore"><meta name="theme-color" content="#13100c"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#13100c;--panel:#0c0c0e;--cream:#fff6ea;--coral:#ff4a1f;--dim:#928b80;--line:#393228}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}::selection{background:var(--coral);color:white}.nav{height:68px;border-bottom:1px solid #28231d;background:rgba(12,12,14,.88);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)}.mark{font:800 23px 'Bricolage Grotesque';letter-spacing:-.6px}.mark b{color:var(--coral)}.back{margin-left:auto;color:var(--dim);text-decoration:none;font-size:13px}.wrap{width:min(720px,calc(100% - 32px));margin:68px auto 100px}.eyebrow{color:var(--coral);font:700 12px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}h1{font:800 clamp(38px,7vw,68px)/.96 'Bricolage Grotesque';letter-spacing:-2.8px;margin:0;max-width:620px}.lede{color:var(--dim);font-size:16px;line-height:1.6;max-width:580px;margin:24px 0 38px}.card{background:#17140f;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:8px 10px 0 rgba(255,246,234,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.full{grid-column:1/-1}label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}label span{color:#756e64;font-weight:400}input,textarea{width:100%;border:1.5px solid #3a342c;border-radius:12px;background:#100e0a;color:var(--cream);font:15px/1.5 'Space Grotesk';padding:13px 14px;outline:none;transition:.15s}textarea{min-height:118px;resize:vertical}input:focus,textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,74,31,.13)}button{margin-top:26px;width:100%;border:2px solid var(--cream);border-radius:999px;background:var(--coral);color:white;font:700 15px 'Space Grotesk';padding:14px;cursor:pointer;box-shadow:3px 3px 0 rgba(255,246,234,.4);transition:.15s}button:hover{transform:translateY(-2px)}button:disabled{opacity:.55;cursor:wait}.note{font-size:11px;color:#6d665c;text-align:center;margin-top:12px}.status{display:none;margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:16px;line-height:1.5}.status.good{display:block;color:var(--cream);border-color:#457d62;background:#14251d}.status.bad{display:block;color:#ffb29e;border-color:#7f3524;background:#29130e}.spark{color:var(--coral)}@media(max-width:620px){.wrap{margin-top:46px}.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{letter-spacing:-1.8px}.nav{padding:0 16px}}
</style></head><body><nav class="nav"><div class="mark">lore<b>.</b></div><a class="back" href="/">back to lore</a></nav><main class="wrap"><div class="eyebrow">growth fellow · remote</div><h1>help lore get into every group chat<span class="spark">.</span></h1><p class="lede">we're looking for one person who moves fast, knows what people actually share, and wants real ownership. no resume maze. tell us how you'd get lore in front of people.</p><section class="card"><form id="form"><div class="grid"><div><label for="name">name</label><input id="name" name="name" autocomplete="name" maxlength="120" required></div><div><label for="email">email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required></div><div class="full"><label for="current">school or what you're doing right now</label><input id="current" name="current_thing" maxlength="240" required></div><div class="full"><label for="why">why lore <span>· 2-3 sentences</span></label><textarea id="why" name="why_lore" maxlength="1200" required></textarea></div><div class="full"><label for="first">what would you do in your first 2 weeks?</label><textarea id="first" name="first_two_weeks" maxlength="1600" required></textarea></div><div><label for="social">twitter or linkedin <span>· optional</span></label><input id="social" name="social" maxlength="300" placeholder="link or @"></div><div><label for="hours">hours per week</label><input id="hours" name="hours_per_week" maxlength="80" placeholder="e.g. 10-15" required></div></div><button id="send" type="submit">send application</button><div class="note">goes straight to the lore team. no form vendor.</div><div id="status" class="status" role="status"></div></form></section></main><script>
const f=document.getElementById('form'),b=document.getElementById('send'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='sending...';s.className='status';const data=Object.fromEntries(new FormData(f).entries());try{const r=await fetch('https://lore-host.onrender.com/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'could not send');s.className='status good';s.textContent="application in. if it's a fit, you'll hear from us.";f.reset();b.textContent='sent';}catch(err){s.className='status bad';s.textContent=err.message||'could not send. try again.';b.disabled=false;b.textContent='send application';}});
</script></body></html>
