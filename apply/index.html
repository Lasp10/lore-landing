<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>growth fellow - lore</title><meta name="description" content="apply to work on growth at lore"><meta name="theme-color" content="#0b0b0b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0b0b;--fg:#ededed;--muted:#858585;--line:#292929;--focus:#666}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.top{height:52px;border-bottom:1px solid #202020;display:flex;align-items:center;padding:0 28px}.logo{font-weight:600;letter-spacing:-.02em}.top a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}.top a:hover{color:var(--fg)}main{width:min(600px,calc(100% - 40px));margin:72px auto 120px}.head{margin-bottom:50px}h1{margin:0 0 12px;font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.025em}.head p{margin:0;color:var(--muted);max-width:500px}.meta{margin-top:20px;display:flex;gap:8px;color:#aaa;font-size:12px}.meta span+span:before{content:"·";margin-right:8px;color:#555}form{display:flex;flex-direction:column;gap:25px}.field label{display:block;font-size:13px;font-weight:500;margin:0 0 8px}.optional{color:#666;font-weight:400;margin-left:5px}input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:4px;background:#101010;color:var(--fg);font:14px/1.5 Inter,-apple-system,sans-serif;padding:10px 11px;outline:none;transition:border-color .12s}textarea{min-height:112px;resize:vertical}input:focus,textarea:focus{border-color:var(--focus)}input::placeholder,textarea::placeholder{color:#515151}.foot{display:flex;align-items:center;gap:18px;margin-top:7px}button{border:0;border-radius:4px;background:#ededed;color:#0b0b0b;font:500 13px Inter,sans-serif;padding:10px 16px;cursor:pointer}button:hover{background:white}button:disabled{opacity:.5;cursor:wait}.privacy{font-size:11px;color:#5f5f5f}.status{display:none;border-top:1px solid var(--line);padding-top:20px;color:#aaa}.status.show{display:block}.status.bad{color:#d78978}@media(max-width:600px){.top{padding:0 20px}main{margin-top:50px}.head{margin-bottom:40px}.foot{align-items:flex-start;flex-direction:column;gap:10px}}
</style></head><body><header class="top"><div class="logo">lore</div><a href="/">loregroupchat.com</a></header><main><section class="head"><h1>Growth fellow</h1><p>Help get Lore into more group chats. We're looking for someone who moves fast, talks to users, and can own experiments from idea to result.</p><div class="meta"><span>Remote</span><span>Part-time</span></div></section><form id="form"><div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="120" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required></div><div class="field"><label for="current">School or what you're doing right now</label><input id="current" name="current_thing" maxlength="240" required></div><div class="field"><label for="why">Why Lore? <span class="optional">2-3 sentences</span></label><textarea id="why" name="why_lore" maxlength="1200" required></textarea></div><div class="field"><label for="first">What would you do in your first 2 weeks?</label><textarea id="first" name="first_two_weeks" maxlength="1600" required></textarea></div><div class="field"><label for="social">Twitter or LinkedIn <span class="optional">Optional</span></label><input id="social" name="social" maxlength="300" placeholder="Link or @handle"></div><div class="field"><label for="hours">Hours per week</label><input id="hours" name="hours_per_week" maxlength="80" placeholder="e.g. 10-15" required></div><div class="foot"><button id="send" type="submit">Submit application</button><span class="privacy">Your answers go directly to the Lore team.</span></div><div id="status" class="status" role="status"></div></form></main><script>
const f=document.getElementById('form'),b=document.getElementById('send'),s=document.getElementById('status');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Submitting...';s.className='status';const data=Object.fromEntries(new FormData(f).entries());try{const r=await fetch('https://lore-host.d.onjrnm.link/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'Could not submit');s.className='status show';s.textContent="Application received. We'll be in touch if there's a fit.";f.reset();b.textContent='Submitted';}catch(err){s.className='status show bad';s.textContent=err.message||'Could not submit. Try again.';b.disabled=false;b.textContent='Submit application';}});
</script></body></html>
