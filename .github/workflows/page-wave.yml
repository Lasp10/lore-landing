name: Apply page wave
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage page wave automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pages
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/pagewave.tar.gz
          tar -xzf /tmp/pagewave.tar.gz
          rm -rf run/selcuk-atli
          rm -f .github/workflows/page-wave.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish blast pages and migrate run subjects'
          git push
