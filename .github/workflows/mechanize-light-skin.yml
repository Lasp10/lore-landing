name: Mechanize light skin
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s' '' | base64 -d >/tmp/mech.tgz
          tar -xzf /tmp/mech.tgz
          rm -f .github/workflows/mechanize-light-skin.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply Mechanize light skin to interactive pages'
          git push
