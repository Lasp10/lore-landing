name: Site copy polish wave
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s' '' | base64 -d >/tmp/site.tgz
          tar -xzf /tmp/site.tgz
          rm -f .github/workflows/site-copy-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add browser try page and polish launch copy'
          git push
