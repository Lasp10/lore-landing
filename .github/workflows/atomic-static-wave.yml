name: Atomic static wave
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s' '' | base64 -d > /tmp/static.tar.gz
          tar -xzf /tmp/static.tar.gz
          rm -f .github/workflows/atomic-static-wave.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Unify launch surfaces and legal pages'
          git push
