<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lore private beta</title><style>:root{color-scheme:dark}body{background:#0a0a0a;color:#f2f2f2;font:18px/1.5 Arial,sans-serif;max-width:620px;margin:10vh auto;padding:24px}h1{font-size:22px;font-weight:500;margin:0 0 72px}h2{font-size:34px;line-height:1.15;margin:0 0 20px}p{color:#b8b8b8}form{margin-top:32px;display:flex;gap:8px}input,button{font:inherit;padding:11px 12px;border:1px solid #555;background:#0a0a0a;color:#f2f2f2}input{min-width:0;flex:1}button{cursor:pointer}button:disabled{color:#777}#status{min-height:27px;color:#f2f2f2}@media(max-width:600px){body{margin:5vh auto}form{display:block}input,button{box-sizing:border-box;width:100%;margin-top:8px}}</style></head><body><h1><svg width="24" height="24" viewBox="0 0 100 100" role="img" aria-label="Lore logo" style="vertical-align:middle"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="50" cy="50" rx="22" ry="44" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="50" cy="50" rx="40" ry="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="66" text-anchor="middle" font-family="serif" font-style="italic" font-weight="700" font-size="46" fill="currentColor">l</text></svg> lore</h1><h2>Join the private beta.</h2><p>Lore lives in your group chat, learns the room, and helps the group do the work.</p><form id="waitlist"><input id="email" type="email" autocomplete="email" required placeholder="your email" aria-label="Email address"><button type="submit">Request access</button></form><p id="status" role="status"></p><p>After you sign up, we will review your group and email you about private beta onboarding.</p><script>var form=document.getElementById('waitlist'),email=document.getElementById('email'),button=form.querySelector('button'),statusLine=document.getElementById('status');form.onsubmit=async function(event){event.preventDefault();if(!email.checkValidity()){email.reportValidity();return}button.disabled=true;statusLine.textContent='Requesting access...';try{var response=await fetch('https://lore-host.onrender.com/waitlist',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:email.value.trim(),source:'private-beta-page'})});var data=await response.json();if(!response.ok||!data.ok||!data.stored)throw new Error('not stored');form.hidden=true;statusLine.textContent="You're on the list. We'll email you about private beta onboarding."}catch(error){button.disabled=false;statusLine.textContent='That did not go through. Try again.'}};</script><footer style="margin-top:64px;border-top:1px solid #333;padding-top:20px"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></footer></body></html>
