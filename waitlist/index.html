<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lore private beta</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090909;color:#f3f3f0;font:17px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:680px;margin:0 auto;padding:72px 28px 40px;letter-spacing:-.01em}h1{font-size:20px;font-weight:450;margin:0 0 108px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}h2{font-size:clamp(38px,7vw,56px);line-height:1.02;letter-spacing:-.045em;font-weight:520;margin:0 0 24px;max-width:540px}p{color:#a7a7a3;max-width:560px;margin:0 0 18px}form{margin:42px 0 24px;display:flex;gap:10px}input,button{font:inherit;padding:14px 16px;border:1px solid #3a3a38;background:#0b0b0b;color:#f3f3f0;transition:border-color .15s ease,background .15s ease}input{min-width:0;flex:1}input:focus{outline:none;border-color:#8b8b86}input::placeholder{color:#686864}button{cursor:pointer;white-space:nowrap;background:#f0f0eb;color:#111;border-color:#f0f0eb}button:hover{background:#fff;border-color:#fff}button:disabled{color:#777}#status{min-height:27px;color:#f2f2f2;font-size:15px}footer{font-size:14px;color:#777}footer a{color:#999;text-decoration:none}footer a:hover{color:#eee}@media(max-width:600px){body{padding:36px 20px}h1{margin-bottom:80px}form{display:block}input,button{box-sizing:border-box;width:100%;margin-top:8px}}</style></head><body><h1><svg width="24" height="24" viewBox="0 0 100 100" role="img" aria-label="Lore logo" style="vertical-align:middle"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="50" cy="50" rx="22" ry="44" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="50" cy="50" rx="40" ry="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="66" text-anchor="middle" font-family="serif" font-style="italic" font-weight="700" font-size="46" fill="currentColor">l</text></svg> lore</h1><h2>Join the private beta.</h2><p>Lore lives in your group chat, learns the room, and helps the group do the work.</p><form id="waitlist"><input id="email" type="email" autocomplete="email" required placeholder="your email" aria-label="Email address"><button type="submit">Request access</button></form><p id="status" role="status"></p><p>After you sign up, we will review your group and email you about private beta onboarding.</p><script>var form=document.getElementById('waitlist'),email=document.getElementById('email'),button=form.querySelector('button'),statusLine=document.getElementById('status');form.onsubmit=async function(event){event.preventDefault();if(!email.checkValidity()){email.reportValidity();return}button.disabled=true;statusLine.textContent='Requesting access...';try{var response=await fetch('https://lore-host.onrender.com/waitlist',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:email.value.trim(),source:'private-beta-page'})});var data=await response.json();if(!response.ok||!data.ok||!data.stored)throw new Error('not stored');form.hidden=true;statusLine.textContent="You're on the list. We'll email you about private beta onboarding."}catch(error){button.disabled=false;statusLine.textContent='That did not go through. Try again.'}};</script><footer style="margin-top:64px;border-top:1px solid #333;padding-top:20px"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></footer></body></html>
