<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lore private beta</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090909;color:#f3f3f0;font:17px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:680px;margin:0 auto;padding:72px 28px 40px;letter-spacing:-.01em}h1{font-size:20px;font-weight:450;margin:0 0 108px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}h2{font-size:clamp(38px,7vw,56px);line-height:1.02;letter-spacing:-.045em;font-weight:520;margin:0 0 24px;max-width:540px}p{color:#a7a7a3;max-width:560px;margin:0 0 18px}form{margin:42px 0 24px;display:flex;gap:10px}input,button{font:inherit;padding:14px 16px;border:1px solid #3a3a38;background:#0b0b0b;color:#f3f3f0;transition:border-color .15s ease,background .15s ease}input{min-width:0;flex:1}input:focus{outline:none;border-color:#8b8b86}input::placeholder{color:#686864}button{cursor:pointer;white-space:nowrap;background:#f0f0eb;color:#111;border-color:#f0f0eb}button:hover{background:#fff;border-color:#fff}button:disabled{color:#777}#status{min-height:27px;color:#f2f2f2;font-size:15px}footer{font-size:14px;color:#777}footer a{color:#999;text-decoration:none}footer a:hover{color:#eee}@media(max-width:600px){body{padding:36px 20px}h1{margin-bottom:80px}form{display:block}input,button{box-sizing:border-box;width:100%;margin-top:8px}}</style>
<style id="mechanize-skin">:root{color-scheme:light}*{box-sizing:border-box}body{background:#fafafa!important;color:#171717!important;font:18px/1.55 Georgia,"Times New Roman",serif!important;max-width:760px!important;margin:0 auto!important;padding:70px 32px!important;letter-spacing:0!important}h1{font:700 20px/1.2 Georgia,serif!important;margin:0 0 90px!important;display:flex;align-items:center;gap:8px}h2{font:700 clamp(38px,7vw,56px)/1.03 Georgia,serif!important;letter-spacing:-.025em!important;margin:0 0 24px!important}p{color:#444!important}form{border-top:1px solid #d4d4cf;padding-top:30px;margin-top:36px!important}input,button{font:17px/1.2 Georgia,serif!important;padding:14px 16px!important;border:1px solid #777!important;background:#fff!important;color:#171717!important}button{background:#222!important;color:#fff!important;border-color:#222!important;font-weight:700!important}input::placeholder{color:#777!important}footer{border-color:#d4d4cf!important;color:#555!important}footer a{color:#171717!important}@media(max-width:600px){body{padding:36px 20px!important}h1{margin-bottom:64px!important}}</style><style id="waitlist-onboarding">form#waitlist{display:grid!important;grid-template-columns:1fr 1fr;gap:22px 16px!important}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font:700 14px/1.35 Arial,sans-serif;letter-spacing:.01em}label .optional{font-weight:400;color:#666;margin-left:5px}input,select,textarea{font:17px/1.35 Georgia,serif!important;padding:13px 14px!important;border:1px solid #777!important;border-radius:0;background:#fff!important;color:#171717!important;width:100%;min-width:0}textarea{resize:vertical;min-height:112px}select{appearance:auto}input:focus,select:focus,textarea:focus{outline:2px solid #222;outline-offset:2px}form#waitlist button{width:fit-content;margin-top:4px;padding:14px 22px!important}@media(max-width:600px){form#waitlist{grid-template-columns:1fr;gap:18px!important}.field,.full{grid-column:1}form#waitlist button{width:100%;margin-top:2px}input,select,textarea{margin:0!important}}</style></head><body><h1><svg width="24" height="24" viewBox="0 0 100 100" role="img" aria-label="Lore logo" style="vertical-align:middle"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="50" cy="50" rx="22" ry="44" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="50" cy="50" rx="40" ry="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="50" y="66" text-anchor="middle" font-family="serif" font-style="italic" font-weight="700" font-size="46" fill="currentColor">l</text></svg> lore</h1><h2>Join the private beta.</h2><p>Lore lives in your group chat, learns the room, and helps the group do the work.</p><form id="waitlist">
  <div class="field full"><label for="email">Email <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"></div>
  <div class="field full"><label for="platform">Chat platform <span aria-hidden="true">*</span></label><select id="platform" name="platform" required><option value="" selected disabled>Select one</option><option value="imessage">iMessage</option><option value="whatsapp">WhatsApp</option><option value="slack">Slack</option><option value="telegram">Telegram</option><option value="discord">Discord</option></select></div>
  <div class="field"><label for="group_type">Group type <span aria-hidden="true">*</span></label><select id="group_type" name="group_type" required><option value="" selected disabled>Select one</option><option value="startup team">Startup team</option><option value="club">Club</option><option value="friends">Friends</option><option value="community">Community</option></select></div>
  <div class="field"><label for="group_size">Group size <span aria-hidden="true">*</span></label><input id="group_size" name="group_size" type="number" min="2" max="100000" inputmode="numeric" required placeholder="5"></div>
  <div class="field full"><label for="first_job">What's the first job you'd give lore? <span aria-hidden="true">*</span></label><textarea id="first_job" name="first_job" required maxlength="500" rows="4" placeholder="Tell us what you want lore to take off your group's plate."></textarea></div>
  <div class="field full"><label for="company_url">Team or company link <span class="optional">optional</span></label><input id="company_url" name="company_url" type="url" pattern="https://.*" title="Use a full HTTPS link" inputmode="url" autocomplete="url" placeholder="https://..."></div>

  <button class="full" type="submit">Request access</button>
</form><p id="status" role="status"></p><p>After you sign up, we will review your group and email you about private beta onboarding.</p><script>var form=document.getElementById('waitlist'),button=form.querySelector('button'),statusLine=document.getElementById('status');form.onsubmit=async function(event){event.preventDefault();if(!form.checkValidity()){form.reportValidity();return}button.disabled=true;statusLine.textContent='Requesting access...';var payload={email:form.email.value.trim(),platform:form.platform.value,group_type:form.group_type.value.trim(),group_size:Number(form.group_size.value),first_job:form.first_job.value.trim(),company_url:form.company_url.value.trim(),heard_from:form.heard_from.value.trim(),source:'private-beta-page'};try{var response=await fetch('https://lore-host.onrender.com/waitlist',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});var data=await response.json();if(!response.ok||!data.ok||!data.stored)throw new Error('not stored');form.style.display='none';statusLine.textContent="You're on the list. We'll email you about private beta onboarding."}catch(error){button.disabled=false;statusLine.textContent='That did not go through. Try again.'}};</script><footer style="margin-top:64px;border-top:1px solid #333;padding-top:20px"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></footer></body></html>
