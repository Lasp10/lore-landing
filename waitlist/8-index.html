<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet lore</title><style>:root{--paper:#edf3ed;--ink:#17261f;--muted:#647169;--line:#c8d5ca;--button:#285847;--button-hover:#34705b;--field:#f7faf6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.page{min-height:100vh;display:grid;place-items:center;padding:44px 20px}.card{width:360px}.mark{margin:0 0 46px;font:700 18px Georgia,"Times New Roman",serif;letter-spacing:-.03em}.brand-logo{width:22px;height:22px;margin-right:7px;vertical-align:-6px}h1{margin:0;font:500 35px/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.04em}.dek{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:36px;padding:16px 20px;background:var(--button);color:#f7f5ef;text-decoration:none;border:0;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}.button:hover{background:var(--button-hover)}.arrow{font-size:17px;font-weight:400}.tiny{margin:14px 0 0;text-align:center;color:#647169;font-size:11px;line-height:1.45}.expect{margin:28px 0 0;padding-top:18px;border-top:1px solid var(--line);color:#647169;font-size:12px;line-height:1.5}input,select{width:100%;height:48px;margin-top:10px;padding:0 13px;border:1px solid #c8d5ca;border-radius:7px;background:var(--field);color:var(--ink);font:14px Arial,sans-serif}input:focus,select:focus{outline:2px solid #285847;outline-offset:1px}.fields{margin-top:28px}.status{min-height:18px;margin:14px 0 0;text-align:center;color:var(--muted);font-size:12px}.links{margin-top:40px;text-align:center;color:#8b877e;font-size:11px}.links a{color:inherit}@media(max-width:480px){.page{place-items:start center;padding-top:15vh}.card{width:min(360px,100%)}.mark{margi </head><body><main class="page"><section class="card"><div class="mark"><img class="brand-logo" src="/lore-logo-512.png" alt="">lore</div><h1>Meet lore in your group chat.</h1><p class="dek">Tell us where to meet you. If there is room in the beta, onboarding opens right away.</p><form class="fields" id="waitlist"><input aria-label="Work email" id="email" type="email" required autocomplete="email" placeholder="you@company.com"><select aria-label="Group chat" id="platform"><option>Slack</option><option>WhatsApp</option></select><button class="button" type="submit">Continue <span class="arrow">→</span></button></form><p class="tiny">One link. No setup call. Lore introduces itself first.</p><p class="status" id="status" role="status"></p><p class="links"><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></p></section></main><script>const f=document.getElementById('waitlist'),b=f.querySelector('button'),s=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();if(!f.checkValidity()){f.reportValidity();return}b.disabled=true;s.textContent='Opening lore...';try{const r=await fetch('https://lore-host.d.onjrnm.link/waitlist',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({email:email.value.trim(),platform:platform.value,source:'private-beta-page'})});const d=await r.json();if(!r.ok||!d.ok||!d.stored)throw 0;if(d.onboarding_url){location.href=d.onboarding_url}else{s.textContent=`You're on the waitlist${d.waitlist_position?' at position '+d.waitlist_position:''}. Lore will open onboarding when capacity is available.`;b.disabled=false}}catch(_){s.textContent='That did not go through. Try again.';b.disabled=false}};</script></body></html>
